services:
  db_pav:
    container_name: db_pav
    image: postgres:16
    environment:
      POSTGRES_USER: pav
      POSTGRES_PASSWORD: pav
      POSTGRES_DB: pav
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./init.sql:/docker-entrypoint-initdb.d/init.sql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U pav -d pav"]
      interval: 5s
      timeout: 5s
      retries: 10

  api_pav:
    container_name: api_pav
    build: .
    image: projeto-pav-api:latest
    environment:
      DATABASE_URL: postgresql+psycopg2://pav:pav@db_pav:5432/pav
      FLASK_ENV: production
      FLASK_DEBUG: "0"
      PORT: "5000"
    ports:
      - "5000:5000"
    depends_on:
      db_pav:
        condition: service_healthy

volumes:
  postgres_data:
